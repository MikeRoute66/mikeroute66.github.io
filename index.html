<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111317">
<title>MiNDweb</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
:root{color-scheme:dark;--bg:#111317;--line:#333b40;--paper:#e6e9db;--mint:#a8e1bd}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 75% 5%,#1d2828,transparent 56%),var(--bg);color:var(--paper);font:500 1rem/1.55 "IBM Plex Mono",monospace}
main{width:min(100% - 2.5rem,62rem);margin:auto;padding:clamp(2rem,8vh,6rem) 0 3rem}
header{position:relative;display:grid;align-items:center;grid-template-columns:1fr 40%;min-height:16rem;padding:clamp(1.4rem,5vw,3.6rem);border:2px solid var(--line);box-shadow:6px 6px #08090b;background:repeating-linear-gradient(0deg,transparent 0 3px,#0002 3px 4px),#171e21;overflow:hidden}
h1{position:relative;z-index:1;margin:0;color:var(--mint);font:400 clamp(1.55rem,6.4vw,4.15rem)/1.45 "Press Start 2P",monospace;letter-spacing:-.055em;text-shadow:4px 4px #294b3d}
canvas{width:100%;image-rendering:pixelated}
header canvas{min-width:8rem;justify-self:end;max-width:19rem}
section{margin-top:2.65rem}
h2{display:flex;align-items:center;gap:1.2rem;margin:0 0 1.1rem;color:#b1beb7;font-size:.8rem;text-transform:uppercase;letter-spacing:.18em}
h2::after{content:"";height:1px;background:var(--line);flex:1}
ul{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem;list-style:none;margin:0;padding:0}
li{--accent:#a8e1bd}
li:nth-child(2){--accent:#edca8f}
li:nth-child(3){--accent:#c7b8ee}
li:nth-child(4){--accent:#91cfe9}
li:nth-child(5){--accent:#eeaebd}
li:nth-child(6){--accent:#cbdc92}
li:nth-child(7){--accent:#efb598}
a{display:grid;min-height:13rem;grid-template-rows:1fr auto;gap:1rem;padding:1rem;text-decoration:none;color:var(--paper);border:2px solid var(--line);background:#1a1e23;box-shadow:4px 4px #08090b}
a:hover,a:focus-visible{border-color:var(--accent);background:#23292e}
a:focus-visible{outline:2px dashed var(--accent);outline-offset:4px}
a canvas{height:6rem;width:100%;object-fit:contain;background:#13171b;border:1px solid #30363c}
.label{display:flex;justify-content:space-between;align-items:baseline;gap:.4rem;font-size:clamp(.85rem,1.75vw,1.1rem);font-weight:600}
.arrow{color:var(--accent)}
@media(max-width:640px){
header{min-height:11rem;grid-template-columns:1fr 33%}
header canvas{min-width:5rem}
ul{grid-template-columns:1fr}
a{grid-template-columns:5rem 1fr;grid-template-rows:auto;align-items:center;min-height:0}
a canvas{height:3.5rem}
.label{font-size:1rem}
}
</style>
</head>
<body>
<main>
<header>
  <h1>MiNDweb</h1>
  <canvas id="hero" width="144" height="100" aria-hidden="true"></canvas>
</header>
<section aria-labelledby="projects">
  <h2 id="projects">Projects</h2>
  <ul>
    <li><a href="https://mikeroute66.github.io/Penrose-Life/"><canvas id="penrose" width="104" height="48" aria-hidden="true"></canvas><span class="label">Penrose-Life <span class="arrow" aria-hidden="true">↗</span></span></a></li>
    <li><a href="https://mikeroute66.github.io/Euclid/"><canvas id="euclid" width="104" height="48" aria-hidden="true"></canvas><span class="label">Euclid <span class="arrow" aria-hidden="true">↗</span></span></a></li>
    <li><a href="https://mikeroute66.github.io/Collatz/"><canvas id="collatz" width="104" height="48" aria-hidden="true"></canvas><span class="label">Collatz Explorer <span class="arrow" aria-hidden="true">↗</span></span></a></li>
    <li><a href="https://github.com/MikeRoute66/Evolution"><canvas id="evolution" width="104" height="48" aria-hidden="true"></canvas><span class="label">Evolution <span class="arrow" aria-hidden="true">↗</span></span></a></li>
    <li><a href="https://mikeroute66.github.io/Lambda/"><canvas id="lambda" width="104" height="48" aria-hidden="true"></canvas><span class="label">Lambda <span class="arrow" aria-hidden="true">↗</span></span></a></li>
    <li><a href="https://mikeroute66.github.io/Conway-Combat/"><canvas id="conway" width="104" height="48" aria-hidden="true"></canvas><span class="label">Conway Combat <span class="arrow" aria-hidden="true">↗</span></span></a></li>
    <li><a href="https://mikeroute66.github.io/Baby-Merchant/"><canvas id="merchant" width="104" height="48" aria-hidden="true"></canvas><span class="label">Baby Merchant <span class="arrow" aria-hidden="true">↗</span></span></a></li>
  </ul>
</section>
</main>
<script>
function draw(id, color, paint) {
  const context = document.getElementById(id).getContext('2d');
  function pixel(x, y, size = 1, opacity = 1) {
    context.globalAlpha = opacity;
    context.fillStyle = color;
    context.fillRect(Math.round(x), Math.round(y), size, size);
  }
  function line(x, y, endX, endY, opacity = 1) {
    const steps = Math.max(Math.abs(endX - x), Math.abs(endY - y), 1);
    for (let step = 0; step <= steps; step++) {
      pixel(x + (endX - x) * step / steps, y + (endY - y) * step / steps, 1, opacity);
    }
  }
  paint(pixel, line);
}
draw('hero', '#a8e1bd', (pixel, line) => {
  for (let y = 8; y < 98; y += 6) {
    for (let x = 4; x < 144; x += 6) pixel(x, y, 1, .24);
  }
  const points = [[73,9],[113,28],[123,64],[93,88],[50,85],[26,58],[36,26]];
  const inner = [[73,29],[96,37],[101,58],[86,71],[61,70],[46,55],[51,37]];
  points.forEach(([x, y], index) => {
    const next = (index + 1) % points.length;
    line(x, y, ...points[next], .82);
    line(x, y, ...inner[index], .6);
    line(...inner[index], ...inner[next], .8);
    line(...inner[index], ...points[next], .35);
    line(...inner[index], 73, 51, .42);
    pixel(x - 1, y - 1, 3);
  });
  pixel(71, 49, 4);
  [[12,28],[132,12],[133,82],[21,81]].forEach(([x,y]) => {
    line(x - 2,y,x + 2,y,.65);
    line(x,y - 2,x,y + 2,.65);
  });
});
draw('penrose', '#a8e1bd', (pixel, line) => {
  const tips = [[52,5],[70,18],[63,39],[41,39],[34,18]];
  const valleys = [[57,17],[61,27],[52,32],[43,27],[47,17]];
  tips.forEach(([x,y], index) => {
    const valley = valleys[index];
    line(x,y,...valley);
    line(...valley,...tips[(index + 1) % tips.length]);
    line(...valley,52,24,.55);
    pixel(x - 1,y - 1,3);
  });
  pixel(51,23,3);
});
draw('euclid', '#edca8f', (pixel, line) => {
  const edges = [[31,9,76,9],[76,9,76,39],[76,39,31,39],[31,39,31,9],
    [61,9,61,39],[61,24,76,24],[31,39,61,9]];
  edges.forEach((edge, index) => line(...edge,index === 6 ? .48 : .9));
  [[31,39],[31,9],[61,9],[61,39],[76,24],[76,39],[76,9]].forEach(([x,y]) => pixel(x - 1,y - 1,3));
});
draw('collatz', '#c7b8ee', (pixel, line) => {
  const points = [[20,25],[28,13],[36,22],[44,8],[52,18],[60,26],[68,33],[76,29],[84,36]];
  line(16,40,89,40,.35);
  points.forEach(([x,y], index) => {
    if (index) line(...points[index - 1],x,y,.78);
    pixel(x - 1,y - 1,3);
  });
});
draw('evolution', '#91cfe9', (pixel, line) => {
  const branches = [[52,40,52,28],[52,28,34,19],[52,28,70,19],
    [34,19,23,8],[34,19,43,8],[70,19,61,8],[70,19,81,8]];
  branches.forEach(edge => line(...edge, .82));
  [[52,40],[52,28],[34,19],[70,19],[23,8],[43,8],[61,8],[81,8]].forEach(([x,y]) => {
    pixel(x - 1,y - 1,3);
  });
});
draw('lambda', '#eeaebd', (pixel, line) => {
  for (let offset = -1; offset <= 1; offset++) {
    line(40 + offset, 9, 46 + offset, 9);
    line(46 + offset, 9, 62 + offset, 37);
    line(52 + offset, 20, 41 + offset, 37);
    line(62 + offset, 37, 66 + offset, 37);
  }
});
draw('conway', '#cbdc92', (pixel) => {
  const glider = [[1,0],[2,1],[0,2],[1,2],[2,2]];
  for (let row = 0; row < 7; row++) {
    for (let column = 0; column < 11; column++) {
      pixel(22 + column * 6, 6 + row * 6, 1, .28);
    }
  }
  glider.forEach(([x,y]) => {
    pixel(29 + x * 6, 7 + y * 6, 4);
    pixel(71 - x * 6, 37 - y * 6, 4, .62);
  });
});
draw('merchant', '#efb598', (pixel, line) => {
  line(37,9,66,9);
  line(37,9,31,18);
  line(66,9,72,18);
  line(31,18,72,18);
  line(35,19,35,36);
  line(68,19,68,36);
  line(33,36,70,36);
  line(35,27,68,27);
  [36,44,52,60,68].forEach(x => pixel(x - 1,18,3));
  pixel(46,22,4,.75);
  pixel(54,23,3,.75);
});
</script>
</body>
</html>
